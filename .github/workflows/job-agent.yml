name: job-agent

on:
  schedule:
    - cron: "43 11 * * *"     # búsqueda diaria: 07:43 hora de Bolivia (UTC-4)
    - cron: "17 */2 * * *"    # cada 2 h: procesa tus botones de Telegram (postular/descartar)
  workflow_dispatch:
    inputs:
      command:
        description: "run | poll"
        default: run

# Nunca dos corridas a la vez: comparten la misma base de datos de estado.
concurrency:
  group: job-agent
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: job-agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: job-agent/requirements.txt

      - run: pip install -r requirements.txt

      - name: Restaurar estado (ofertas ya vistas)
        uses: actions/cache/restore@v4
        with:
          path: job-agent/state
          key: jobagent-state-${{ github.run_id }}
          restore-keys: jobagent-state-

      - name: CV en PDF desde secreto (opcional)
        env:
          CV_PDF_BASE64: ${{ secrets.CV_PDF_BASE64 }}
        if: env.CV_PDF_BASE64 != ''
        run: echo "$CV_PDF_BASE64" | base64 -d > config/cv.pdf

      - name: Ejecutar
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          CV_TEXT: ${{ secrets.CV_TEXT }}
        run: |
          CMD="${{ github.event.inputs.command }}"
          if [ -z "$CMD" ]; then
            if [ "${{ github.event.schedule }}" = "43 11 * * *" ]; then CMD=run; else CMD=poll; fi
          fi
          python -m jobagent "$CMD"

      - name: Guardar estado
        if: always()
        uses: actions/cache/save@v4
        with:
          path: job-agent/state
          key: jobagent-state-${{ github.run_id }}

      - name: Subir resumen y cartas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ofertas-${{ github.run_id }}
          path: job-agent/output
          if-no-files-found: ignore
          retention-days: 30
