# Programas de ingreso a organismos internacionales que abren UNA vez al año (fácil perderlos).
# Investigado el 25-11-2026. Fernando: boliviano, 28 años (nacido ~1998), maestría VUB, ~4-5 años de experiencia,
# inglés y francés C1. "confirmado" = leído en la página oficial; "estimado" = por ciclos previos o fuentes terceras.
# La corrida del domingo revisa esta lista (TAREA_DOMINGO.md, paso 6c).
- programa: "Banco Mundial - Young Professionals Program (YPP)"
  url: "https://www.worldbank.org/en/about/careers/programs-and-internships/young-professionals-program"
  requisitos: "Sin tope de edad. Maestría + 2 a 6 años de experiencia profesional al 1-sep. Inglés excelente; francés suma."
  ventana: "abre ~1-sep, cierra ~30-sep (2026 confirmado); próximo estimado sept-2027"
  ajuste: alta
- programa: "BID - Programa de Jóvenes Profesionales"
  url: "https://jobs.iadb.org"
  requisitos: "Menos de 32 años, maestría, ~2 años de experiencia, ciudadano de país miembro (Bolivia sí). Inglés y español; francés suma."
  ventana: "históricamente ene-feb; no abre todos los años. Estimado ene-feb 2027"
  ajuste: alta
- programa: "CAF - PRODES (jóvenes profesionales)"
  url: "https://www.caf.com/es/trabaja-con-nosotros/empleo/"
  requisitos: "Hasta 32 años, maestría, 2-5 años, inglés avanzado (datos de ediciones antiguas: verificar)"
  ventana: "sin fecha confirmada; revisar cada domingo"
  ajuste: alta
- programa: "IDB Invest - Crea tu futuro"
  url: "https://www.idbinvest.org/en/crea"
  requisitos: "30 años o menos al 1-ene del año de postulación; maestría en finanzas/economía; 2 años"
  ventana: "no confirmada; edición vigente incierta"
  ajuste: media
- programa: "UNV internacional (especialista)"
  url: "https://www.unv.org/become-volunteer/volunteer-abroad"
  requisitos: "Fuera de Bolivia; 25-27 años o más; 2-3 años o más según puesto. Subsidio de vida, no salario: puerta a la ONU"
  ventana: "continua"
  ajuste: media
- programa: "BID - pasantías pagadas en Washington"
  url: "https://jobs.iadb.org/en/internships/dc"
  requisitos: "Posgrado hasta 33 años (fuente de buscador)"
  ventana: "invierno 16-ene a 15-mar y verano 16-jun a 15-ago; se postula 3-4 meses antes"
  ajuste: media
- programa: "Comunidad Andina - pasantías y plazas"
  url: "https://www.comunidadandina.org/convocatorias/vacantes-personal/"
  requisitos: "Nacionales de BO/CO/EC/PE"
  ventana: "pasantías 2027 cerraron 16-nov-2026; plazas sin fecha fija"
  ajuste: media
- programa: "UE - prácticas Blue Book (Comisión Europea)"
  url: "https://traineeships.ec.europa.eu"
  requisitos: "Sin tope de edad; inglés, francés o alemán C1; cupo pequeño para no europeos"
  ventana: "para oct-2027: estimado mar-abr 2027"
  ajuste: media
- programa: "ONU - Young Professionals Programme (YPP)"
  url: "https://careers.un.org"
  requisitos: "32 o menos; solo nacionalidades de la lista del año. Bolivia NO estuvo en 2025; revisar cada año"
  ventana: "oct-nov"
  ajuste: baja
- programa: "Becas para maestría o doctorado que abren más puertas (Chevening, Fulbright)"
  url: ""
  requisitos: "Solo si Fernando quiere un PhD: el Economist Program del FMI lo exige"
  ventana: "revisar"
  ajuste: baja
