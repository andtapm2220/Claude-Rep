# ─────────────────────────────────────────────────────────────────────────────
#  TU PERFIL. Esto es lo que hace que la búsqueda sea "tailored".
#  Completa/ajusta cada sección. El CV completo va en config/cv.md.
# ─────────────────────────────────────────────────────────────────────────────

nombre: "Tu Nombre"
resumen: >
  COMPLETAR: 2-4 líneas sobre quién eres profesionalmente, años de experiencia,
  especialidad y qué tipo de rol buscas ahora.

# Cargos objetivo (en el orden en que te interesan)
roles_objetivo:
  - "COMPLETAR: p. ej. Analista económico"
  - "COMPLETAR: p. ej. Analista de datos"

# Palabras clave que suben la prioridad (se usan en el prefiltro barato y
# como búsquedas en Get on Board / Remotive). Mezcla español e inglés.
keywords:
  - analista
  - economista
  - datos
  - finanzas
  - presupuesto
  - data analyst

# Si alguna de estas aparece en el TÍTULO, la oferta se descarta sin gastar en Claude.
excluir_titulo:
  - vendedor
  - mercaderista
  - impulsador
  - cajero
  - chofer
  - courier
  - guardia
  - almacen
  - promotor
  - call center
  - asesor telefonico
  - auxiliar de lavado

seniority: "COMPLETAR: junior | semi-senior | senior | jefatura"
salario_minimo_bs: 0          # mensual en Bs; 0 = no filtrar
ciudades: ["La Paz", "El Alto"] # presencial/híbrido aceptable
acepta_remoto: true
paises_region: ["Bolivia", "Peru", "Chile", "Colombia", "Argentina", "Mexico"]  # para presencial regional
idiomas: ["Español (nativo)", "Inglés (COMPLETAR nivel)"]

# Cosas que para ti son deal-breakers o preferencias fuertes (Claude las tiene en cuenta)
preferencias: |
  COMPLETAR. Ejemplos:
  - Prefiero sector financiero, consultoría o sector público.
  - No quiero roles de ventas puras ni con metas comerciales.
  - Me interesan roles donde use Excel avanzado, Python/SQL o Power BI.

# ─────────────────────────────────────────────────────────────────────────────
#  Configuración del agente
# ─────────────────────────────────────────────────────────────────────────────
agente:
  max_para_claude: 40       # tras el prefiltro, cuántas ofertas puntúa Claude por día
  puntaje_minimo: 65        # sólo se notifican ofertas con este puntaje o más
  confianza_minima: 50      # 0-100: por debajo, la oferta se marca como dudosa y no se notifica
  max_antiguedad_dias: 21   # ofertas más viejas se descartan (señal de "oferta fantasma")
  modelo: "claude-opus-5-5" # para bajar costo ~40x: "claude-haiku-5-5"
  cartas_para_top: 5        # redacta carta de presentación para las N mejores

fuentes:
  trabajito:
    enabled: true
    regions: ["la-paz", "bolivia"]   # slugs de trabajito.com.bo/empleos/<slug>
    max_pages: 5
    max_details: 80
  computrabajo:
    enabled: true
    regions: ["la-paz"]              # bo.computrabajo.com/empleos-en-<slug>
    keyword_pages: ["economista", "analista"]  # bo.computrabajo.com/trabajo-de-<slug>
    max_pages: 4
    max_details: 80
  trabajopolis:
    enabled: true                    # tiene Cloudflare: si bloquea, se omite sin error
    regions: ["la-paz"]
    max_details: 40
  getonbrd:
    enabled: true
    countries: ["Bolivia"]           # presencial en estos países; el remoto se acepta aparte
    accept_remote: true
  remotive:
    enabled: true
