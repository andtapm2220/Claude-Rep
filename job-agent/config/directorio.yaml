# ─────────────────────────────────────────────────────────────────────────────
#  DIRECTORIO de empleadores a vigilar: embajadas, organismos, mineras y
#  transnacionales en Bolivia.
#
#  - Con `empleo_url`: el vigía revisa esa página TODOS los días (gratis).
#  - Sin `empleo_url`: entra en la ROTACIÓN; cada día Claude busca en la web
#    unos cuantos (los de prioridad alta, más seguido).
#  - verificado: si = confirmado en fuentes en nov-2026; verificar = sale del
#    conocimiento general de Claude y la rotación lo confirma (o lo descarta).
#  Agrega, quita o cambia prioridades libremente.
# ─────────────────────────────────────────────────────────────────────────────

agregadores:   # una sola página que trae vacantes de MUCHOS empleadores en Bolivia
  - {nombre: "Impactpool - Bolivia", prioridad: alta, verificado: si, empleo_url: "https://www.impactpool.org/countries/Bolivia", link_pattern: "/jobs/\\d+", max_new: 30, org: "", nota: "ONU, BID, Banco Mundial, UNV, ONG internacionales"}
  - {nombre: "BID - feed de vacantes Bolivia", prioridad: alta, verificado: si, empleo_url: "https://jobs.iadb.org/services/rss/job/?locale=es_ES&keywords=(Bolivia)", tipo: rss, org: "BID"}
