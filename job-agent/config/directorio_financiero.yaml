# ─────────────────────────────────────────────────────────────────────────────
#  Páginas de empleo encontradas por `python -m jobagent descubrir` (26-11-2026) a partir de los
#  registros oficiales (ASFI, APS, registro de auditoras) en config/universo/*.csv.
#  Solo entra lo que se puede VIGILAR gratis (Python): enlaces por oferta (link_pattern) o
#  `tipo: cambio` (renglones nuevos). Lo que no tiene página NO entra a la rotación de búsquedas,
#  para no gastar tokens; se vuelve a probar el primer domingo de cada mes (TAREA_DOMINGO 6e).
# ─────────────────────────────────────────────────────────────────────────────

